# Construit l'appli Android (Play Store) à partir du site.
# Résultat : onglet « Actions » > dernière exécution > « Artifacts » en bas de page.
name: Appli Android

on:
  push:
    branches: [main]
    paths: ["index.html", "*.png", "android/**", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé d'envoi Play Store (si elle est enregistrée dans les secrets)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Clé trouvée : le fichier .aab sera signé."
          else
            echo "::warning::Aucune clé d'envoi dans les secrets : le fichier .aab ne sera pas signé (le Play Store le refusera)."
          fi

      - name: Construire
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/BlindPokerLab-test-v${VERSION_CODE}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/BlindPokerLab-playstore-v${VERSION_CODE}.aab"

      - name: Fichier .aab pour le Play Store
        uses: actions/upload-artifact@v4
        with:
          name: playstore-aab-v${{ github.run_number }}
          path: dist/*.aab

      - name: Fichier .apk pour tester sur un téléphone
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-v${{ github.run_number }}
          path: dist/*.apk
